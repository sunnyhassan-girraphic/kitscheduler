{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G.R.E.G - Sign in</title>
<link rel="icon" type="image/x-icon" href="{% static 'inventory/img/favicon.ico' %}">
<link rel="icon" type="image/png" sizes="32x32" href="{% static 'inventory/img/favicon-32.png' %}">
<link rel="icon" type="image/png" sizes="16x16" href="{% static 'inventory/img/favicon-16.png' %}">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --accent: rgb(234, 179, 8);
    --accent-on: #1a1400;
    --text: #ededea;
    --red: #f85149;
    --mono: "SF Mono", "JetBrains Mono", Consolas, monospace;
  }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 14px;
  }

  /* Full-screen background */
  .login-bg {
    position: fixed; inset: 0; z-index: 0;
    background: #1a1a1a url("{% static 'inventory/img/login-bg-2.png' %}") center/cover no-repeat;
  }

  /* Wrap - align card to top centre */
  .login-wrap {
    position: relative; z-index: 1;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }

  /* Card - hangs from top, flat top edge, rounded bottom corners */
  .login-panel {
    width: 100%;
    max-width: 360px;
    padding: 36px 36px 40px;

    /* Flat top (flush with page top), curved bottom corners only */
    border-radius: 0 0 24px 24px;

    background: rgba(15, 15, 15, 0.38);
    backdrop-filter: blur(28px) saturate(1.3) brightness(0.85);
    -webkit-backdrop-filter: blur(28px) saturate(1.3) brightness(0.85);
  }

  /* Giraffe */
  .login-giraffe {
    display: flex; justify-content: center; margin-bottom: 14px;
  }
  .login-giraffe img {
    width: 48px; height: 48px; display: block;
    filter: drop-shadow(0 2px 16px rgba(234, 179, 8, 0.5));
  }

  /* Title */
  .login-title-block { text-align: center; margin-bottom: 28px; }
  .login-app-name {
    font-size: 32px; font-weight: 800; letter-spacing: 0.1em;
    color: var(--accent); line-height: 1; margin-bottom: 6px;
  }
  .login-app-sub {
    font-size: 10px; color: rgba(255, 255, 255, 0.35);
    font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.12em;
  }

  /* Fields */
  .login-field { margin-bottom: 12px; }
  .login-field label {
    display: block; font-size: 11px; font-weight: 600;
    color: rgba(255, 255, 255, 0.35);
    margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.06em;
  }
  .login-field input {
    width: 100%;
    background: rgba(255, 255, 255, 0.08);
    border: none;
    border-bottom: 1px solid rgba(255, 255, 255, 0.15);
    color: var(--text); border-radius: 6px; padding: 9px 11px;
    font-size: 14px; font-family: inherit; outline: none;
    transition: border-color 0.15s, background 0.15s;
  }
  .login-field input:focus {
    border-color: var(--accent);
    background: rgba(255, 255, 255, 0.11);
  }
  .login-field input::placeholder { color: rgba(255, 255, 255, 0.15); }

  /* Error */
  .login-error {
    background: rgba(248, 81, 73, 0.12); border: 1px solid rgba(248, 81, 73, 0.25);
    border-radius: 8px; padding: 9px 12px;
    color: var(--red); font-size: 13px; margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .login-error svg { width: 14px; height: 14px; flex-shrink: 0; }

  /* Button */
  .login-btn {
    width: 100%; padding: 11px 16px;
    background: var(--accent); border: none; border-radius: 8px;
    color: var(--accent-on); font-size: 14px; font-weight: 700;
    font-family: inherit; cursor: pointer; margin-top: 10px;
    transition: opacity 0.15s;
  }
  .login-btn:hover { opacity: 0.9; }
  .login-btn:active { opacity: 0.8; }

  /* Footer */
  .login-footer {
    margin-top: 20px; text-align: center;
    font-size: 11px; font-family: var(--mono);
  }
  .login-footer a { color: rgba(255, 255, 255, 0.15); text-decoration: none; }
  .login-footer a:hover { color: rgba(255, 255, 255, 0.4); }
</style>
</head>
<body>
  <div class="login-bg"></div>
  <div class="login-wrap">
    <div class="login-panel">

      <div class="login-giraffe">
        <img src="{% static 'inventory/img/giraffe-mark.png' %}" alt="G.R.E.G">
      </div>

      <div class="login-title-block">
        <div class="login-app-name">G.R.E.G</div>
        <div class="login-app-sub">Girraphic Resource &amp; Equipment Gateway</div>
      </div>

      {% if error %}
      <div class="login-error">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ error }}
      </div>
      {% endif %}

      <form method="post" action="/login/">
        {% csrf_token %}
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        <div class="login-field">
          <label for="id_username">Username</label>
          <input type="text" id="id_username" name="username" autocomplete="username" autofocus
                 placeholder="">
        </div>
        <div class="login-field">
          <label for="id_password">Password</label>
          <input type="password" id="id_password" name="password" autocomplete="current-password"
                 placeholder="">
        </div>
        <button class="login-btn" type="submit">Sign in</button>
      </form>

      <div class="login-footer">
        <a href="/admin/">Django admin</a>
      </div>

    </div>
  </div>
</body>
</html>
